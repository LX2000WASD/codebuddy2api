# 本分支镜像构建：推送到 local/main（或手动触发）时，先跑全量后端测试门禁，
# 再用仓库自己的 Dockerfile 构建完整镜像（内含前端构建与前端门禁），
# 产出 ghcr.io/<owner>/codebuddy2api:local 与 :local-<sha>。
#
# 2026-11-04 起不再使用「上游预构建底座 + 覆盖层」的方式：上游 GHCR 只发布到 1.4.2，
# 而本仓库已并入上游 1.5.2 的代码，底座标签不存在会让构建直接失败。完整构建与
# Dockerfile 里的 VERSION、依赖锁保持一致。
name: build-local-image
on:
  push:
    branches: [local/main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      # Hash-pinned install: matches .github/workflows/docker.yml so the local
      # image gate verifies the same artifacts instead of resolving fresh ones.
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.txt'
      - name: Run the full test suite
        run: |
          overall=0
          for script in tests/test_*.py; do
            echo "::group::$script"
            python -B "$script" || overall=1
            echo "::endgroup::"
          done
          exit $overall

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name (GHCR requirement)
        run: echo "IMAGE_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          # BUILD_CHANNEL/BUILD_COMMIT land in build.json; the Updates page uses them to
          # tell a fork build from an upstream release.
          build-args: |
            BUILD_CHANNEL=local
            BUILD_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_LC }}:local
            ${{ env.REGISTRY }}/${{ env.IMAGE_LC }}:local-${{ github.sha }}
