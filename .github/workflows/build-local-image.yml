# 本地移植层镜像构建:推送到 local/main(或手动触发)时,
# 先跑全量测试门禁,再以官方预构建镜像为底座 + COPY 我们的 Python 层,
# 产出 ghcr.io/<owner>/codebuddy2api:local。
name: build-local-image
on:
  push:
    branches: [local/main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Run the full test suite
        run: |
          overall=0
          for script in tests/test_*.py; do
            echo "::group::$script"
            python -B "$script" || overall=1
            echo "::endgroup::"
          done
          exit $overall

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name (GHCR requirement)
        run: echo "IMAGE_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - name: Pull official base image
        run: docker pull ghcr.io/maiphucgiang/codebuddy2api:1.3.2
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.local
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_LC }}:local
            ${{ env.REGISTRY }}/${{ env.IMAGE_LC }}:local-${{ github.sha }}
